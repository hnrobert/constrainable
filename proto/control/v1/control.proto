// Control protocol between a media node (Go) and the ingest app (Nitro),
// carried as one Envelope per WebSocket binary message, both directions.
// Correlated request/response pairs (seq) replace socket.io acks; Heartbeat
// replaces engine.io ping/pong; SDP offers/answers and DVR file chunks travel
// as raw bytes, so there is no base64 inflation anywhere.
//
// Naming conventions (mirrors the mmr agent protos):
//   - CMsg*                      data/entity types carried inside messages
//   - XxxRequest / XxxResponse   correlated RPC pairs (seq in RpcRequest/RpcResponse)
//   - XxxMessage                 fire-and-forget push events (Event oneof bodies)
//   - protocol frames unprefixed: Envelope, Hello/HelloAck, Heartbeat/
//     HeartbeatAck, RpcRequest/RpcResponse, Error
syntax = "proto3";

package control.v1;

option go_package = "media-node/gen/control/v1;controlv1";

message Envelope {
  oneof kind {
    Hello hello = 1;
    HelloAck hello_ack = 2;
    Heartbeat heartbeat = 3;
    HeartbeatAck heartbeat_ack = 4;
    RpcRequest rpc_request = 5;
    RpcResponse rpc_response = 6;
    // Fire-and-forget push frames — the oneof case IS the dispatch name
    // (the protobuf equivalent of a hub method name).
    LimitsConfigMessage limits_config = 7; // app -> node (on connect + config change)
    KickStreamMessage kick_stream = 8; // app -> node
    RecordingCancelMessage recording_cancel = 9; // app -> node (was node:rec:stop)
    RecordingDeleteMessage recording_delete = 10; // app -> node (was recording:delete)
    PublishMetricsMessage publish_metrics = 11; // node -> app (5s cadence = liveness)
    PublishViolationMessage publish_violation = 12;
    PublishEndedMessage publish_ended = 13;
    RecordingReadyMessage recording_ready = 14;
    RecordingChunkMessage recording_chunk = 15;
    RecordingStreamEndMessage recording_stream_end = 16;
  }
}

// First frame node -> app after the WS handshake. Carries the shared token
// once; the app answers HelloAck then pushes Event.limits_config.
message Hello {
  string identifier = 1; // NODE_IDENTIFIER (source of the app-assigned node id)
  string hostname = 2;
  string version = 3;
  string auth_token = 4;
  CMsgPublicEndpoints endpoints = 5;
}

// Advertised public endpoints (was the PUBLIC_MEDIA_NODE_* register payload).
message CMsgPublicEndpoints {
  string public_origin = 1; // "" = users push via the app host
  int32 public_rtmp_port = 2;
  int32 public_probe_udp_port = 3;
  int32 public_srs_udp_port = 4;
  string srs_flv_base = 5; // FLV base as reachable from the app backend
}

message HelloAck {
  string node_id = 1; // app-assigned node id (was node:registered)
}

message Heartbeat {
  int64 sent_at_ms = 1;
}

message HeartbeatAck {
  int64 echoed_sent_at_ms = 1;
}

// Correlated request/response. Node -> app: authorize_publish, judge_spec,
// auth_*. App -> node: whep_relay, recording_pull. Either side may answer
// with Error instead of the matching body.
message RpcRequest {
  uint32 seq = 1;
  oneof body {
    AuthorizePublishRequest authorize_publish = 2;
    JudgeSpecRequest judge_spec = 3;
    AuthSaltRequest auth_salt = 4;
    AuthVerifyRequest auth_verify = 5;
    AuthPolicyRequest auth_policy = 6;
    WhepRelayRequest whep_relay = 7;
    RecordingPullRequest recording_pull = 8;
  }
}

message RpcResponse {
  uint32 seq = 1;
  oneof body {
    AuthorizePublishResponse authorize_publish = 2;
    JudgeSpecResponse judge_spec = 3;
    AuthSaltResponse auth_salt = 4;
    AuthVerifyResponse auth_verify = 5;
    AuthPolicyResponse auth_policy = 6;
    WhepRelayResponse whep_relay = 7;
    RecordingPullResponse recording_pull = 8;
    Error error = 9;
  }
}

message Error {
  string message = 1;
}

// Publish gate (was the publish:start ack).
message AuthorizePublishRequest {
  string node_id = 1;
  string stream_name = 2;
  string token = 3;
  string authed_user = 4;
  string srs_client_id = 5;
}

message AuthorizePublishResponse {
  bool allow = 1;
  string reason = 2;
  int64 session_id = 3;
  optional int64 event_id = 4;
  string event_key = 5;
  CMsgLimits limits = 6;
  bool record = 7;
  bool strict = 8;
  bool measured = 9;
}

message CMsgLimits {
  int32 max_width = 1;
  int32 max_height = 2;
  int32 max_fps = 3;
  int32 max_video_bitrate_kbps = 4;
  int32 max_audio_bitrate_kbps = 5;
}

// Declared-spec gate (was the publish:spec ack).
message JudgeSpecRequest {
  string node_id = 1;
  string stream_name = 2;
  optional int32 width = 3;
  optional int32 height = 4;
  optional double fps = 5;
  optional double video_kbps = 6;
  optional double audio_bitrate_kbps = 7;
}

message JudgeSpecResponse {
  bool allow = 1;
  string reason = 2;
}

// RTMP authmod (was the auth:salt / auth:verify / auth:policy acks).
message AuthSaltRequest {
  string email = 1;
}

message AuthSaltResponse {
  string salt = 1;
  bool banned = 2;
}

message AuthVerifyRequest {
  string email = 1;
  string opaque = 2;
  string challenge = 3;
  string response = 4;
}

message AuthVerifyResponse {
  bool allow = 1;
  bool known = 2;
}

message AuthPolicyRequest {
  string token = 1;
  string stream = 2;
}

message AuthPolicyResponse {
  bool publish_key = 1;
  bool require_account_auth = 2;
  bool window_open = 3;
  bool banned = 4;
}

// WHEP signaling relay (app -> node; was node:whep). The node POSTs the offer
// to its local SRS and returns the answer; browser media then flows over UDP
// directly to the node's SRS.
message WhepRelayRequest {
  string stream_name = 1;
  bytes offer_sdp = 2;
}

message WhepRelayResponse {
  bytes answer_sdp = 1;
  string error = 2;
}

// Recording file relay (app -> node; was node:rec:pull). The node streams
// Event.recording_chunk frames (raw bytes) for this req_id until
// recording_stream_end.
message RecordingPullRequest {
  string req_id = 1;
  string rel_path = 2; // relative to the node RECORD_DIR; node validates
}

message RecordingPullResponse {
  bool started = 1;
}

message LimitsConfigMessage {
  CMsgLimits global = 1;
  repeated CMsgEventLimits events = 2;
}

message CMsgEventLimits {
  int64 event_id = 1;
  CMsgLimits limits = 2;
}

message KickStreamMessage {
  string stream_name = 1;
  string reason = 2;
}

message RecordingCancelMessage {
  string req_id = 1;
}

// Tells the node to delete the given recording segment files on its disk.
message RecordingDeleteMessage {
  repeated string rel_paths = 1;
}

message PublishMetricsMessage {
  int64 session_id = 1;
  optional int32 width = 2;
  optional int32 height = 3;
  optional double fps = 4;
  optional int32 video_bitrate_kbps = 5;
  optional int32 audio_bitrate_kbps = 6;
}

message PublishViolationMessage {
  int64 session_id = 1;
  repeated string reasons = 2;
  PublishMetricsMessage metrics = 3;
}

message PublishEndedMessage {
  int64 session_id = 1;
  int64 ended_at_ms = 2;
  int32 duration_sec = 3;
}

message RecordingReadyMessage {
  string node_id = 1;
  string stream_name = 2;
  optional int64 event_id = 3;
  optional int64 session_id = 4;
  repeated CMsgRecordingSegment segments = 5;
  int64 size_bytes = 6;
  int32 duration_sec = 7;
  optional double avg_fps = 8;
  optional int32 width = 9;
  optional int32 height = 10;
}

message CMsgRecordingSegment {
  string rel_path = 1;
  int64 size_bytes = 2;
  int32 duration_sec = 3;
}

message RecordingChunkMessage {
  string req_id = 1;
  bytes data = 2;
}

message RecordingStreamEndMessage {
  string req_id = 1;
  string error = 2;
}
